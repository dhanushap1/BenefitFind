
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BenefitFind</title>

    <style>
        :root {
            --primary: #176B5B;
            --primary-dark: #105446;
            --accent: #D96C4F;
            --background: #F7F4ED;
            --white: #FFFFFF;
            --text: #24332F;
            --muted: #68756F;
            --border: #DDE3DE;
            --success: #3F8065;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .navbar {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand {
            color: var(--primary);
            font-size: 25px;
            font-weight: bold;
        }

        .brand span {
    color: var(--primary);
    }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .admin-name {
            color: var(--muted);
            font-size: 14px;
        }

        .logout-btn {
            background: var(--white);
            color: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 7px;
            padding: 10px 16px;
        }

        .logout-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        .container {
            width: 90%;
            max-width: 1250px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(36, 51, 47, 0.04);
        }

        .stat-card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-card h2 {
            color: var(--primary);
            font-size: 30px;
        }

        .section {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            font-size: 21px;
        }

        .primary-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 7px;
            padding: 11px 17px;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full-width {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 14px;
            font-weight: bold;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 12px;
            background: var(--white);
            color: var(--text);
            outline: none;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--primary);
        }

        .field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .secondary-btn {
            background: var(--white);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 11px 17px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .toolbar input,
        .toolbar select {
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 11px;
            background: var(--white);
            color: var(--text);
        }

        .toolbar input {
            flex: 1;
            min-width: 180px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }

        th, td {
            text-align: left;
            padding: 15px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            vertical-align: top;
        }

        th {
            background: #F4F7F4;
            color: var(--primary-dark);
        }

        td {
            line-height: 1.5;
        }

        .category {
            display: inline-block;
            background: #E7F1EC;
            color: var(--primary-dark);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 12px;
        }

        .action-btn {
            border: none;
            border-radius: 5px;
            padding: 7px 10px;
            margin: 2px;
        }

        .edit-btn {
            background: #E7F1EC;
            color: var(--primary-dark);
        }

        .delete-btn {
            background: #FBE9E5;
            color: #A63E2A;
        }

        .message {
            display: none;
            padding: 13px 15px;
            margin-bottom: 18px;
            border-radius: 7px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.success {
            display: block;
            color: #245D43;
            background: #E5F3E9;
        }

        .message.error {
            display: block;
            color: #923B2D;
            background: #FBE9E5;
        }

        .empty-state {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .container {
                width: 94%;
                margin-top: 24px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full-width {
                grid-column: auto;
            }

            .section {
                padding: 17px;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .navbar {
                padding: 16px 4%;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="brand">Benefit<span>Find</span></div>

        <div class="nav-right">
            <span class="admin-name" id="adminName">Administrator</span>
            <button class="logout-btn" id="logoutBtn" type="button">
                Logout
            </button>
        </div>
    </header>

    <main class="container">

        <div class="welcome">
            <h1>Admin Dashboard</h1>
            <p>Manage government benefit schemes and keep scheme information updated.</p>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <section class="stats">
            <article class="stat-card">
                <p>Total Schemes</p>
                <h2 id="totalSchemes">0</h2>
            </article>

            <article class="stat-card">
                <p>Active Schemes</p>
                <h2 id="activeSchemes">0</h2>
            </article>

            <article class="stat-card">
                <p>Categories Covered</p>
                <h2 id="totalCategories">0</h2>
            </article>
        </section>

        <section class="section" id="formSection">
            <div class="section-heading">
                <h2 id="formTitle">Add New Scheme</h2>
            </div>

            <form id="schemeForm">
                <input type="hidden" id="schemeId">

                <div class="form-grid">
                    <div class="field">
                        <label for="schemeName">Scheme Name *</label>
                        <input id="schemeName" type="text" required maxlength="150">
                    </div>

                    <div class="field">
                        <label for="category">Category *</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option value="Education">Education</option>
                            <option value="Employment">Employment</option>
                            <option value="Housing">Housing</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Agriculture">Agriculture</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="benefit">Benefit *</label>
                        <input id="benefit" type="text" required maxlength="500">
                    </div>

                    <div class="field">
                        <label for="deadline">Deadline *</label>
                        <input id="deadline" type="date" required>
                    </div>

                    <div class="field full-width">
                        <label for="description">Description</label>
                        <textarea id="description" maxlength="3000"></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="schemeUrl">Official Scheme URL</label>
                        <input id="schemeUrl" type="url"
                               placeholder="https://example.gov.in">
                    </div>

                    <div class="field full-width">
                        <label for="eligibility">Eligibility (JSON format)</label>
                        <textarea id="eligibility"
                                  placeholder='Example: {"state":"Kerala","occupation":"farmer"}'>{}</textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="primary-btn" id="saveBtn" type="submit">
                        Add Scheme
                    </button>

                    <button class="secondary-btn hidden" id="cancelEditBtn"
                            type="button">
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <section class="section">
            <div class="section-heading">
                <h2>Manage Schemes</h2>
                <button class="primary-btn" id="refreshBtn" type="button">
                    Refresh
                </button>
            </div>

            <div class="toolbar">
                <input type="search" id="searchInput"
                       placeholder="Search schemes by name or benefit">

                <select id="filterCategory">
                    <option value="">All Categories</option>
                    <option value="Education">Education</option>
                    <option value="Employment">Employment</option>
                    <option value="Housing">Housing</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Agriculture">Agriculture</option>
                </select>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Scheme Name</th>
                            <th>Category</th>
                            <th>Benefit</th>
                            <th>Deadline</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="schemeTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">
                                Loading schemes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        BenefitFind Admin Panel
    </footer>

    <script>
        const API_URL = "/api/schemes";

        const token = sessionStorage.getItem("adminToken");
        const adminDetails = JSON.parse(
            sessionStorage.getItem("adminDetails") || "null"
        );

        let schemes = [];

        const messageBox = document.getElementById("message");
        const schemeForm = document.getElementById("schemeForm");
        const tableBody = document.getElementById("schemeTableBody");

        // Require an admin session.
        if (!token || !adminDetails || adminDetails.role !== "admin") {
            window.location.replace("/admin-login.html");
        } else {
            document.getElementById("adminName").textContent =
                adminDetails.name || "Administrator";

            loadSchemes();
        }

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = "message " + type;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function clearMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        async function apiRequest(url, options = {}) {
            const headers = {
                ...(options.headers || {})
            };

            if (options.body) {
                headers["Content-Type"] = "application/json";
            }

            // Send the token for admin-only operations.
            if (options.method && options.method !== "GET") {
                headers["Authorization"] = "Bearer " + token;
            }

            const response = await fetch(url, {
                ...options,
                headers
            });

            const data = await response.json().catch(() => ({}));

            if (response.status === 401 || response.status === 403) {
                sessionStorage.removeItem("adminToken");
                sessionStorage.removeItem("adminDetails");
                window.location.replace("/admin-login.html");
                throw new Error("Your admin session has expired. Please log in again.");
            }

            if (!response.ok) {
                throw new Error(data.message || "Request failed.");
            }

            return data;
        }

        async function loadSchemes() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-state">Loading schemes...</td>
                </tr>
            `;

            try {
                const data = await apiRequest(API_URL);
                schemes = Array.isArray(data) ? data : [];

                updateStatistics();
                renderSchemes();
            } catch (error) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            Unable to load schemes.
                        </td>
                    </tr>
                `;

                showMessage(error.message, "error");
            }
        }

        function updateStatistics() {
            document.getElementById("totalSchemes").textContent =
                schemes.length;

            document.getElementById("activeSchemes").textContent =
                schemes.filter(scheme => scheme.active !== false).length;

            const categories = new Set(
                schemes.map(scheme => scheme.category).filter(Boolean)
            );

            document.getElementById("totalCategories").textContent =
                categories.size;
        }

        function renderSchemes() {
            const searchTerm = document.getElementById("searchInput")
                .value.trim().toLowerCase();

            const categoryFilter = document.getElementById("filterCategory").value;

            const filteredSchemes = schemes.filter(scheme => {
                const matchesSearch =
                    (scheme.name || "").toLowerCase().includes(searchTerm) ||
                    (scheme.benefit || "").toLowerCase().includes(searchTerm);

                const matchesCategory =
                    !categoryFilter || scheme.category === categoryFilter;

                return matchesSearch && matchesCategory;
            });

            if (filteredSchemes.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            No schemes found.
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.replaceChildren();

            filteredSchemes.forEach(scheme => {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = scheme.name || "";

                const categoryCell = document.createElement("td");
                const categoryBadge = document.createElement("span");
                categoryBadge.className = "category";
                categoryBadge.textContent = scheme.category || "Other";
                categoryCell.appendChild(categoryBadge);

                const benefitCell = document.createElement("td");
                benefitCell.textContent = scheme.benefit || "";

                const deadlineCell = document.createElement("td");
                deadlineCell.textContent = formatDate(scheme.deadline);

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "action-btn edit-btn";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => editScheme(scheme._id));

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "action-btn delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener(
                    "click",
                    () => deleteScheme(scheme._id, scheme.name)
                );

                actionCell.append(editButton, deleteButton);
                row.append(
                    nameCell,
                    categoryCell,
                    benefitCell,
                    deadlineCell,
                    actionCell
                );

                tableBody.appendChild(row);
            });
        }

        function formatDate(value) {
            if (!value) return "Not specified";

            // Display date-only values without timezone shifts.
            const datePart = String(value).slice(0, 10);
            const parts = datePart.split("-");

            if (
                parts.length === 3 &&
                parts[0].length === 4 &&
                parts[1].length === 2 &&
                parts[2].length === 2
            ) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }

            return datePart;
        }

        schemeForm.addEventListener("submit", async event => {
            event.preventDefault();
            clearMessage();

            let eligibility;

            try {
                eligibility = JSON.parse(
                    document.getElementById("eligibility").value || "{}"
                );

                if (
                    eligibility === null ||
                    typeof eligibility !== "object" ||
                    Array.isArray(eligibility)
                ) {
                    throw new Error("Eligibility must be a JSON object.");
                }
            } catch (error) {
                showMessage(
                    "Enter valid eligibility JSON, for example: {\"state\":\"Kerala\"}",
                    "error"
                );
                return;
            }

            const schemeId = document.getElementById("schemeId").value;

            const schemeData = {
                name: document.getElementById("schemeName").value.trim(),
                category: document.getElementById("category").value,
                benefit: document.getElementById("benefit").value.trim(),
                deadline: document.getElementById("deadline").value,
                description: document.getElementById("description").value.trim(),
                url: document.getElementById("schemeUrl").value.trim(),
                eligibility
            };

            if (
                schemeData.url &&
                !/^https?:\/\//i.test(schemeData.url)
            ) {
                showMessage("Scheme URL must begin with http:// or https://.", "error");
                return;
            }

            const saveButton = document.getElementById("saveBtn");
            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {
                if (schemeId) {
                    await apiRequest(`${API_URL}/${encodeURIComponent(schemeId)}`, {
                        method: "PUT",
                        body: JSON.stringify(schemeData)
                    });

                    showMessage("Scheme updated successfully.", "success");
                } else {
                    await apiRequest(API_URL, {
                        method: "POST",
                        body: JSON.stringify(schemeData)
                    });

                    showMessage("Scheme added successfully.", "success");
                }

                resetForm();
                await loadSchemes();
            } catch (error) {
                showMessage(error.message, "error");
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Add Scheme";
            }
        });

        function editScheme(id) {
            const scheme = schemes.find(
                item => String(item._id) === String(id)
            );

            if (!scheme) {
                showMessage("Scheme not found.", "error");
                return;
            }

            document.getElementById("schemeId").value = scheme._id;
            document.getElementById("schemeName").value = scheme.name || "";
            document.getElementById("category").value = scheme.category || "";
            document.getElementById("benefit").value = scheme.benefit || "";
            document.getElementById("deadline").value =
                String(scheme.deadline || "").slice(0, 10);
            document.getElementById("description").value =
                scheme.description || "";
            document.getElementById("schemeUrl").value = scheme.url || "";
            document.getElementById("eligibility").value =
                JSON.stringify(scheme.eligibility || {}, null, 2);

            document.getElementById("formTitle").textContent = "Edit Scheme";
            document.getElementById("saveBtn").textContent = "Update Scheme";
            document.getElementById("cancelEditBtn").classList.remove("hidden");

            clearMessage();

            document.getElementById("formSection").scrollIntoView({
                behavior: "smooth"
            });
        }

        async function deleteScheme(id, name) {
            const confirmed = window.confirm(
                `Are you sure you want to delete "${name}"?`
            );

            if (!confirmed) return;

            clearMessage();

            try {
                await apiRequest(
                    `${API_URL}/${encodeURIComponent(id)}`,
                    { method: "DELETE" }
                );

                resetForm();
                await loadSchemes();
                showMessage("Scheme deleted successfully.", "success");
            } catch (error) {
                showMessage(error.message, "error");
            }
        }

        function resetForm() {
            schemeForm.reset();
            document.getElementById("schemeId").value = "";
            document.getElementById("eligibility").value = "{}";
            document.getElementById("formTitle").textContent = "Add New Scheme";
            document.getElementById("saveBtn").textContent = "Add Scheme";
            document.getElementById("cancelEditBtn").classList.add("hidden");
        }

        document.getElementById("cancelEditBtn").addEventListener("click", () => {
            resetForm();
            clearMessage();
        });

        document.getElementById("refreshBtn").addEventListener("click", () => {
            clearMessage();
            loadSchemes();
        });

        document.getElementById("searchInput").addEventListener(
            "input",
            renderSchemes
        );

        document.getElementById("filterCategory").addEventListener(
            "change",
            renderSchemes
        );

        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem("adminToken");
            sessionStorage.removeItem("adminDetails");
            window.location.replace("/admin-login.html");
        });
    </script>

</body>
</html>
